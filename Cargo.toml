[package]
name = "spike-ai-pipeline-onenote"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "The OneNote CLI of spike-ai-pipeline: OneNote sections, packages, and notebooks to a JSON model"
repository = "https://github.com/JaimeStill/spike-ai-pipeline-onenote"
publish = false

[dependencies]
# The OneNote reader (MPL-2.0), used unmodified: sections, notebooks, and, through onepkg,
# packages. It brings cab 0.6 for .onepkg, and time and typed-path, which its API takes and
# returns.
onenote_parser = { version = "2.1.0", features = ["onepkg"] }
typed-path = "0.12.4"
time = "0.3.55"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# dup2, to point file descriptor 1 at /dev/null while onenote_parser runs (src/stdout.rs).
libc = "0.2.191"
# The cabinet reader onenote_parser reads .onepkg packages with, taken directly to list a
# package's entries for its recycle bin, which the parser drops without a word; and, in the
# tests, its MSZIP writer, which builds the packages they read.
cab = "0.6.0"
# SHA-256, which names each media file by its content.
sha2 = "0.11.1"
# Unicode general categories, which the math port (src/math/), as one2html, sorts an
# equation's characters by.
finl_unicode = { version = "1.5.1", default-features = false, features = ["categories"] }

[dev-dependencies]
# utc_datetime!, for the unit tests' times.
time = { version = "0.3.55", features = ["macros"] }
# An XML reader, so the tests check each ink SVG is well-formed; the CLI writes SVG itself.
roxmltree = "0.21.2"
